[mcp_servers.xano]
command = "npx"
args = ["-y", "@xano/developer-mcp"]

[mcp_servers.playwright]
command = "npx"
args = [
  "-y",
  "@playwright/mcp@latest",
  "--cdp-endpoint=chrome"
]

[agents.mira-implementer]
description = "MIRA Implementer: executa somente o escopo autorizado e devolve evidências ao Supervisor."
config_file = "agents/mira-implementer.toml"

[agents.mira-reviewer]
description = "MIRA Reviewer: revisão independente e read-only de OpenSpec, diffs, testes, riscos e gates."
config_file = "agents/mira-reviewer.toml"
