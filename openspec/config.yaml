schema: spec-driven

context: |
  Projeto: MIRA

  Domínio:
    Plataforma acadêmica de Service Desk e observabilidade para totens de
    autoatendimento de uma rede de restaurantes.

  Usuários:
    - Gerente: acompanha ativos da unidade, abre chamados manuais e acompanha a tratativa.
    - Técnico: trabalha na fila, assume e trata chamados.
    - Diretoria: consulta dashboards e indicadores consolidados.

  Tecnologias:
    - Frontend: Reflex.
    - Backend, banco de dados, autenticação e regras de negócio: Xano / XanoScript.
    - Automação: Python para Simulator e Fiscal.
    - Especificação: OpenSpec.
    - Agente de desenvolvimento: OpenAI Codex.
    - Apoio XanoScript: Xano Developer MCP.
    - Sincronização com o workspace: Xano CLI.
    - Automação local: GNU Make.

  Arquitetura:
    - Reflex concentra a aplicação web, o Service Desk e os dashboards.
    - Xano concentra persistência, autenticação, autorização, APIs, agregações e regras de negócio.
    - Simulator apenas gera telemetria para ativos já cadastrados.
    - Fiscal apenas dispara periodicamente a verificação de heartbeat.
    - A decisão de Offline e a criação de incidente automático permanecem no Xano.

  Regras críticas:
    - evento_timestamp é a referência temporal da telemetria.
    - Mais de 15 minutos sem telemetria permite marcar o ativo como Offline.
    - Incidentes automáticos equivalentes não podem ser duplicados enquanto houver um aberto.
    - A abertura manual de chamado pelo gerente permanece independente do monitoramento automático.
    - O SLA é configurado pela categoria de serviço por meio de sla_horas.
    - Não inventar tempos fixos de SLA, matriz de impacto e urgência, novos status ou novas regras sem change aprovada.
    - Regras de autorização devem ser aplicadas no Xano.

  Desenvolvimento:
    - Desenvolver de forma incremental utilizando OpenSpec.
    - Mudanças relevantes de regra de negócio, API, modelo de dados ou arquitetura devem ser especificadas antes da implementação.
    - Preservar o comportamento e o modelo existentes quando a change atual não determinar alteração.
    - Escrever documentação e artefatos OpenSpec em português brasileiro.

rules:
  proposal:
    - Descrever claramente problema, objetivo e escopo.
    - Diferenciar comportamento existente de mudança nova.

  specs:
    - Escrever requisitos observáveis e verificáveis.
    - Incluir cenários de sucesso, erro e autorização quando relevantes.

  tasks:
    - Dividir a implementação em tarefas pequenas e verificáveis.
    - Separar tarefas de Reflex, XanoScript e Python quando aplicável.

operations:
  apply:
    guidance:
      - Implementar somente o que estiver aprovado na change.
      - Validar XanoScript com o Xano Developer MCP quando aplicável.

  archive:
    guidance:
      - Confirmar que a implementação corresponde à especificação antes de arquivar.
